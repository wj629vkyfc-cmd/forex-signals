<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accueil - Signaux Trading</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0f14;
      color: #f5f7fa;
      min-height: 100vh;
    }

    header {
      background: #111820;
      padding: 22px 18px;
      border-bottom: 1px solid #27313d;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
      color: #4f91ff;
    }

    main {
      max-width: 700px;
      margin: auto;
      padding: 30px 16px;
    }

    .hero {
      background: linear-gradient(145deg, #151f2b, #0e141c);
      border: 1px solid #293544;
      border-radius: 18px;
      padding: 28px 22px;
      text-align: center;
    }

    h1 {
      font-size: 30px;
      margin-bottom: 14px;
    }

    p {
      color: #aab5c1;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    a {
      text-decoration: none;
      padding: 14px;
      border-radius: 10px;
      font-weight: bold;
      text-align: center;
    }

    .primary {
      background: #4f91ff;
      color: white;
    }

    .secondary {
      border: 1px solid #344252;
      color: #f5f7fa;
      background: #121922;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">📈 Signaux Trading</div>
  </header>

  <main>
    <section class="hero">

      <h1>Bienvenue sur Signaux Trading</h1>

      <p>
        Une plateforme d'apprentissage dédiée à l'analyse
        des marchés et aux signaux de trading.
      </p>

      <div class="buttons">
        <a href="inscription.html" class="primary">
          Créer un compte
        </a>

        <a href="connexion.html" class="secondary">
          Se connecter
        </a>

        <a href="index.html" class="secondary">
          Voir les signaux
        </a>
      </div>

    </section>
  </main>

</body>
</html>
